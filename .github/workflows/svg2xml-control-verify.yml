name: SVG2XML Control Surface Verify
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'api/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/svg2xml-control-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:paint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-paint-comparison
          path: artifacts/svg-paint/
      - run: npm run benchmark:color-groups
      - run: npm run benchmark:color-groups-overlap
      - run: npm run benchmark:color-groups-real-complex
      - name: Verify diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Verify no conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo 'Conflict marker found.' >&2
            exit 1
          fi
