name: Cleanup merged branches
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: cleanup merged branches' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete known merged branches
        shell: bash
        env:
          BRANCHES: |
            feature/control-surface-v2
            upgrade/engine-v2-small-patch
        run: |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done <<< "$BRANCHES"
